<!DOCTYPE html>
<html lang="zh-cn">

<head>
  <meta charset="utf-8">
  <title>关键词漫游器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12141a">
  <meta name="description" content="给一个词,沿上级/下级/相邻词一路逛下去,顺手去 B 站看视频。">
  <!-- PWA:可安装成独立桌面应用(界面外壳离线可用;/api/* 始终走网络) -->
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
  <header>
    <input id="word-input" placeholder="输入一个词,开始漫游…">
    <input id="flavor-input" value="{{ default_flavor }}" title="口味偏好">
    <button onclick="roamFromInput()">漫游</button>
    <button onclick="openSettings()" title="口味预设/详情长度/放飞程度">⚙ 设置</button>
    <button onclick="toggleMap()" title="把足迹画成词图,可找两词最短路径">🗺 地图</button>
  </header>

  <div id="status"></div>

  <div id="history">
    <h3 id="hist-head" title="点词优先吃缓存:按词已有数据打开——筛选分类下点=按分类跳,全部页按 深挖>漫游>详情,没有数据的按当前页模式生成。词后的色点:绿=漫游 紫=深挖 蓝=详情">
      <span>足迹(自动保存,重启不丢)<span id="chip-count"></span></span>
      <span class="legend">去过方式&ensp;<i class="dot dot-roam"></i> 漫游 <i class="dot dot-deep"></i> 深挖 <i class="dot dot-detail"></i> 详情</span>
    </h3>
    <div id="hist-tools">
      <span class="chip ftab active" data-f="all" onclick="setFilter('all')">全部</span>
      <span class="chip ftab" data-f="roam" onclick="setFilter('roam')">🧭 漫游图</span>
      <span class="chip ftab" data-f="deep" onclick="setFilter('deep')">🔍 深挖过</span>
      <span class="chip ftab" data-f="detail" onclick="setFilter('detail')">📖 读过详情</span>
      <span class="sort-switch" title="足迹排序">
        <button class="stab active" data-s="time" onclick="setSort('time')">最近</button>
        <button class="stab" data-s="name" onclick="setSort('name')">名称</button>
      </span>
      <input id="chip-search" placeholder="筛词,即输即筛…">
    </div>
    <div id="chips-wrap" class="collapsed">
      <div id="chips"></div>
    </div>
    <span id="chips-toggle" onclick="toggleChips()" hidden>展开全部 ▾</span>
  </div>

  <div id="layout">
    <aside id="sidebar">
      <div id="side-groups"></div>
    </aside>
    <aside id="note-col" class="collapsed">
      <b id="note-title">📝 笔记</b>
      <textarea id="note-input" placeholder="写点什么:看了哪些视频、自己的理解、下回想挖的小径…"></textarea>
      <span class="note-status" id="note-status"></span>
    </aside>
    <main id="main">
      <div id="center"></div>
      <div id="center-chat" class="detail-box chat-box" hidden></div>
    </main>
    <aside id="toc"></aside>
  </div>
  <div id="map-view" hidden>
    <div id="map-bar">
      <b>🗺 足迹地图</b>
      <span id="map-stat" class="map-note"></span>
      <label><input type="checkbox" id="map-frontier" onchange="toggleFrontier()"> 显示没走过的邻居</label>
      <button id="map-path-btn" onclick="armPath()">🔗 两词路径</button>
      <span id="map-path-info" class="map-note"></span>
      <span id="map-close" onclick="toggleMap()">✕ 关闭</span>
    </div>
    <canvas id="map-canvas"></canvas>
  </div>

  <div id="settings-view" hidden>
    <div id="settings-panel">
      <b>⚙ 设置</b>
      <div class="set-group">
        <label>口味预设<span class="set-note">点选填入漫游框;自己存的可以 × 掉</span></label>
        <div id="flavor-chips"></div>
        <div class="set-row">
          <input id="flavor-new" placeholder="输入你的常用口味,存成预设…">
          <button onclick="addFlavorPreset()">存预设</button>
        </div>
      </div>
      <div class="set-group">
        <label>详情长度<span class="set-note">📖详情的目标字数,下一次生成起生效</span></label>
        <div class="seg" id="seg-detail-len">
          <span data-v="短" onclick="setDetailLen(this)">短(80字)</span>
          <span data-v="标准" onclick="setDetailLen(this)">标准(150字)</span>
          <span data-v="长" onclick="setDetailLen(this)">长(300字)</span>
        </div>
      </div>
      <div class="set-group">
        <label>放飞程度<span class="set-note">漫游/详情的温度:稳=少惊喜,抽风=容易撞见怪东西</span></label>
        <div class="seg" id="seg-temp">
          <span data-v="稳" onclick="setTempStyle(this)">稳</span>
          <span data-v="标准" onclick="setTempStyle(this)">标准</span>
          <span data-v="抽风" onclick="setTempStyle(this)">抽风</span>
        </div>
      </div>
      <div class="set-group">
        <label>自动补详情<span class="set-note">漫游出来后,后台顺手把「下级+相邻」的详情也生成掉——你接着点任意一个,右栏直接有内容。代价:一轮约 8~14 条请求(一毛上下);总生成不出来的词连续失败 3 次后就跳过,不再重复花钱</span></label>
        <div class="seg" id="seg-auto-detail">
          <span data-v="off" onclick="setAutoDetail(this)">关</span>
          <span data-v="smart" onclick="setAutoDetail(this)">智能(下级+相邻)</span>
          <span data-v="all" onclick="setAutoDetail(this)">全部(含上级)</span>
        </div>
      </div>
      <div class="set-group">
        <label>模型接口<span class="set-note">端点/key/模型。留空则回落到环境变量(LLM_*/DEEPSEEK_*),老用法不受影响;改完即生效,不用重启</span></label>
        <div class="set-row">
          <input id="api-base" placeholder="BASE_URL,如 https://api.deepseek.com" oninput="apiDraft('base_url', this.value)">
        </div>
        <div class="set-row">
          <input id="api-key" type="password" placeholder="API Key(sk-…)" oninput="apiDraft('key', this.value)">
          <button onclick="clearApiKey()" title="清除已保存的 key">清空</button>
        </div>
        <div class="set-row">
          <input id="api-model" placeholder="模型名" oninput="apiDraft('model', this.value)" list="api-model-list">
          <datalist id="api-model-list"></datalist>
        </div>
        <div class="set-row">
          <input id="api-max-tokens" placeholder="max_tokens(默认 8000)" oninput="apiDraft('max_tokens', this.value)" style="width:150px">
          <input id="api-temperature" placeholder="温度(留空=按档位)" oninput="apiDraft('temperature', this.value)" style="width:150px">
        </div>
        <div class="set-row">
          <button onclick="testConn()" id="api-test-btn">测试连接</button>
          <span class="set-note" id="api-key-note"></span>
        </div>
        <div id="api-result" class="api-result" hidden></div>
      </div>
      <div class="set-group">
        <label>黑名单<span class="set-note">永不推荐的词(卡片 🚫 一键拉黑,或手动加);生成时拼进提示词,可随时解禁</span></label>
        <div id="bl-chips"></div>
        <div class="set-row">
          <input id="bl-new" placeholder="手动添加不想再见的词…">
          <button onclick="addBlacklist()">拉黑</button>
        </div>
      </div>
      <div class="set-group">
        <label>足迹导出<span class="set-note">JSON=完整备份(含追问);Markdown=可读词表。删缓存=地图清零,常备份</span></label>
        <div class="seg">
          <span onclick="location.href='/api/export?format=json'">📦 全部 JSON</span>
          <span onclick="location.href='/api/export?format=md'">📄 全部 Markdown</span>
        </div>
        <div class="seg" style="margin-top:6px">
          <span onclick="location.href='/api/export?what=notes&format=md'">📝 笔记 MD</span>
          <span onclick="location.href='/api/export?what=notes&format=json'">🧊 笔记 JSON</span>
        </div>
      </div>
      <div id="settings-foot">
        <span id="settings-msg"></span>
        <span id="settings-close" onclick="closeSettings()">✕ 关闭</span>
      </div>
    </div>
  </div>

  <div id="sel-menu" hidden>
    <div class="sel-close" onclick="hideSel()">✕</div>
    <div class="sel-term" id="sel-term"></div>
    <div class="sel-actions" id="sel-actions">
      <button class="deep-btn" onclick="askWhat()">是什么?</button>
      <button class="deep-btn" onclick="showAskInput()">追问…</button>
    </div>
    <div class="ans" id="sel-ans"></div>
  </div>

    <script src="/static/js/state.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/sidebar.js"></script>
  <script src="/static/js/detail.js"></script>
  <script src="/static/js/roam.js"></script>
  <script src="/static/js/roamdata.js"></script>
  <script src="/static/js/chat.js"></script>
  <script src="/static/js/note.js"></script>
  <script src="/static/js/map.js"></script>
  <script src="/static/js/footprint.js"></script>
  <script src="/static/js/selection.js"></script>
  <script src="/static/js/autodetail.js"></script>
  <script src="/static/js/main.js"></script>
  <script src="/static/js/settings.js"></script>

  <script>
    /* PWA:注册 service worker,让浏览器把本页当作"可安装的应用"。
       只在安全上下文生效(localhost / https)。注册失败不影响任何功能——
       这个应用本来就是个普通网页,SW 只是给它加一层"能装到桌面 + 外壳离线"。 */
    if ('serviceWorker' in navigator && (location.protocol === 'https:' ||
        ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname))) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .catch(err => console.warn('[PWA] service worker 注册失败(不影响使用):', err));
      });
    }
  </script>
</body>

</html>
